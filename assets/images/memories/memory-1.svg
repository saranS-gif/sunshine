<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad1)"/>
  
  <!-- Stars -->
  <circle cx="80" cy="90" r="1.5" fill="#bae6fd" opacity="0.8"/>
  <circle cx="320" cy="120" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="60" r="1.8" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="140" cy="180" r="1.2" fill="#bae6fd" opacity="0.6"/>

  <!-- Moon Silhouette -->
  <circle cx="280" cy="110" r="45" fill="#e0f2fe" filter="url(#glow1)" opacity="0.95"/>
  <circle cx="300" cy="100" r="42" fill="#0f172a"/>

  <!-- Two figures silhouette looking at the stars -->
  <path d="M165 310 C165 260, 185 245, 195 240 C190 230, 190 215, 200 205 C210 195, 225 200, 225 215 C225 228, 220 236, 215 242 C225 248, 240 265, 240 310 Z" fill="#020617" opacity="0.95"/>
  <path d="M130 310 C130 265, 150 250, 160 245 C155 235, 155 220, 165 210 C175 200, 190 205, 190 220 C190 232, 185 240, 180 246 C190 252, 205 270, 205 310 Z" fill="#03081c" opacity="0.95"/>
  
  <!-- Subtle Glowing Horizon -->
  <ellipse cx="200" cy="380" rx="220" ry="80" fill="#1d4ed8" opacity="0.25" filter="url(#glow1)"/>
</svg>
