<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="60%" stop-color="#09142e"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad2)"/>
  
  <!-- Glowing Constellation / Fireflies -->
  <circle cx="200" cy="180" r="6" fill="#7dd3fc" filter="url(#glow2)"/>
  <circle cx="150" cy="130" r="4" fill="#38bdf8" filter="url(#glow2)"/>
  <circle cx="260" cy="140" r="4.5" fill="#bae6fd" filter="url(#glow2)"/>
  <circle cx="170" cy="230" r="3.5" fill="#38bdf8" filter="url(#glow2)"/>
  <circle cx="240" cy="220" r="5" fill="#7dd3fc" filter="url(#glow2)"/>

  <!-- Delicate Heart lines in constellation -->
  <path d="M200 190 Q150 120 180 90 Q200 80 200 110 Q200 80 220 90 Q250 120 200 190 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <text x="200" y="320" fill="#bae6fd" font-family="'Playfair Display', Georgia, serif" font-size="16" letter-spacing="3" text-anchor="middle" opacity="0.85">UNDER THE MIDNIGHT SKY</text>
</svg>
