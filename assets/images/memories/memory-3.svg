<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad3)"/>

  <!-- Ethereal Blue Flower in Glass Jar / Cloche -->
  <path d="M150 120 C150 70, 250 70, 250 120 L250 270 C250 280, 240 290, 230 290 L170 290 C160 290, 150 280, 150 270 Z" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.4"/>
  <ellipse cx="200" cy="290" rx="65" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Glowing Blue Rose inside cloche -->
  <circle cx="200" cy="180" r="22" fill="#2563eb" filter="url(#glow3)" opacity="0.85"/>
  <circle cx="200" cy="180" r="12" fill="#7dd3fc" filter="url(#glow3)"/>
  <path d="M200 200 Q200 240 200 275" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 230 Q215 220 225 225" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Floating fireflies around jar -->
  <circle cx="120" cy="190" r="3" fill="#bae6fd" filter="url(#glow3)"/>
  <circle cx="280" cy="160" r="2.5" fill="#bae6fd" filter="url(#glow3)"/>
  <circle cx="170" cy="100" r="2" fill="#ffffff" filter="url(#glow3)"/>
</svg>
